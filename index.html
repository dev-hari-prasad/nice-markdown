    <style>
      /* Reset & Base */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        overflow: hidden; /* App handles scrolling */
        background-color: var(--color-bg, #09090b);
        color: var(--color-text, #a1a1aa);
      }

      /* Custom Scrollbar driven by CSS Variables */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-scroll-track, #09090b);
        border-left: 1px solid var(--color-border, #27272a);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-scroll-thumb, #3f3f46);
        border: 2px solid var(--color-scroll-track, #09090b);
        border-radius: var(--radius, 4px);
      }
      ::-webkit-scrollbar-thumb:hover {
        opacity: 0.8;
      }

      /* Editor Specifics */
      .editor-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      .editor-layer {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        padding: 0;
        margin: 0;
        border: 0;
        background: transparent;
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: break-word;
        overflow: auto; 
        resize: none;
        outline: none;
        tab-size: 2;
        font-family: var(--font-mono, 'JetBrains Mono');
        line-height: 1.6;
        letter-spacing: -0.01em;
      }

      .editor-textarea {
        z-index: 10;
        color: transparent;
        caret-color: var(--color-accent, #3b82f6);
        background: transparent;
      }

      .editor-highlight {
        z-index: 5;
        pointer-events: none;
        color: var(--color-text-active, #e4e4e7);
      }

      .editor-textarea::selection {
        background: rgba(59, 130, 246, 0.2);
        color: transparent;
      }

      /* Markdown Preview Specifics */
      .markdown-body {
        line-height: 1.6;
      }

      .markdown-body .search-hit {
        background: rgba(250, 204, 21, 0.22);
        border-radius: 2px;
        padding: 0 0.05em;
      }
      
      .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
        color: var(--color-text, #f4f4f5);
        font-weight: 600;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        letter-spacing: -0.02em;
      }

      .markdown-body h1 { border-bottom: 1px solid var(--color-border, #27272a); padding-bottom: 0.3em; font-size: 1.75em; }
      .markdown-body h2 { font-size: 1.4em; }
      .markdown-body p { margin-bottom: 1.2em; }
      
      .markdown-body code {
        background: var(--color-code-bg, #27272a);
        color: var(--color-code-text, #e4e4e7);
        padding: 0.2em 0.4em;
        font-size: 0.85em;
        border-radius: var(--radius, 4px);
      }
      
      .markdown-body pre {
        background: transparent;
        border: none;
        padding: 0;
        overflow-x: visible;
        margin: 0;
      }
      
      .markdown-body pre code {
        background: transparent;
        padding: 0;
        color: inherit;
        font-size: 0.85em;
      }

      .markdown-body blockquote {
        border-left: 3px solid var(--color-accent, #3b82f6);
        padding-left: 1rem;
        margin-left: 0;
        color: var(--color-text-muted, #a1a1aa);
        background: transparent;
        display: flex;
        align-items: center;
      }

      .markdown-body ul, .markdown-body ol { padding-left: 1.5em; margin-bottom: 1.2em; }
      .markdown-body li { margin-bottom: 0.25em; }

      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.5em;
        font-size: 0.9em;
      }
      
      .markdown-body th, .markdown-body td {
        border: 1px solid var(--color-border, #27272a);
        padding: 0.5rem 0.75rem;
        text-align: left;
      }
      
      .markdown-body th {
        background: var(--color-ui, #18181b);
        color: var(--color-text, #fff);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
      }

      .markdown-body a {
        color: var(--color-accent, #60a5fa);
        text-decoration: none;
        border-bottom: 1px dotted var(--color-accent, #60a5fa);
      }
      .markdown-body a:hover { border-bottom-style: solid; }
      
      .markdown-body img {
        max-width: 100%;
        border: 1px solid var(--color-border, #27272a);
        border-radius: var(--radius, 4px);
      }
      
      .markdown-body hr {
        border: 0;
        border-top: 1px solid var(--color-border, #27272a);
        margin: 2em 0;
      }

      /* Checkbox styles */
      .markdown-body input[type="checkbox"] {
        appearance: none;
        width: 1em;
        height: 1em;
        border: 1px solid var(--color-text-muted, #52525b);
        background: var(--color-bg, #18181b);
        vertical-align: middle;
        margin-right: 0.5em;
        position: relative;
        top: -1px;
        border-radius: var(--radius, 2px);
      }
      .markdown-body input[type="checkbox"]:checked {
        background: var(--color-accent, #3b82f6);
        border-color: var(--color-accent, #3b82f6);
      }

      /* Mermaid container */
      .mermaid {
        background: var(--color-code-bg, #18181b);
        padding: 1rem;
        display: flex;
        justify-content: center;
        border: 1px solid var(--color-border, #27272a);
        margin-bottom: 1.5rem;
        border-radius: var(--radius, 4px);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(2px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Print Styles for PDF Export */
      @media print {
        @page { margin: 2cm; }
        
        body, #root, .app-container {
          background-color: white !important;
          color: black !important;
          height: auto !important;
          min-height: 100% !important;
          width: 100% !important;
          overflow: visible !important;
          position: static !important;
          display: block !important;
        }

        /* Hide UI elements */
        .toolbar-container, .editor-pane, .resizer, .footer-statusbar, .settings-popover, .download-popover {
          display: none !important;
        }
        
        /* Ensure Main Content Area is visible */
        .main-area {
          display: block !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }
        
        /* Force Preview to take over */
        .preview-pane {
          display: block !important;
          width: 100% !important;
          max-width: 100% !important;
          height: auto !important;
          overflow: visible !important;
          border: none !important;
          position: static !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .markdown-body {
          padding: 0 !important;
          overflow: visible !important;
          height: auto !important;
          color: black !important;
        }
        
        /* Ensure readable high contrast for print */
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body p, .markdown-body li {
          color: #000 !important;
        }
        .markdown-body pre, .markdown-body code {
          border: 1px solid #ccc !important;
          background: #f5f5f5 !important; 
          color: #000 !important;
          box-shadow: none !important;
        }
        
        .markdown-body a {
          text-decoration: underline !important;
          color: #000 !important;
          border-bottom: none !important;
        }

        .mermaid {
          border: 1px solid #ccc !important;
          background: #fff !important;
        }
      }

    </style>
